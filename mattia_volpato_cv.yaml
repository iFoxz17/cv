  sections:

    summary:
      - >
        Data Engineer with a strong software engineering focus, 
        working on distributed systems and data-intensive applications. 
        Experience developing scalable data platforms and distributed processing workloads 
        using Python, PySpark, Databricks and cloud technologies, 
        alongside software engineering experience in Java, AWS and microservices. 
        Strong computer science background in algorithms, data structures and graph theory.
        
    education:

    - institution: University of Milano Bicocca
      area: Computer Science
      degree: Master of Science
      start_date: 2023-10
      end_date: 2025-09
      location: Milan, Italy
      summary: 110/110 cum laude
      highlights:
        - >
          Thesis: [Delay Prediction in Supply Chains — A Hybrid Graph-Based and
          Machine Learning Approach](https://github.com/iFoxz17/sc-delay-prediction).
          Developed at Cefriel as part of the M4ESTRO Horizon Europe project.

    - institution: University of Milano Bicocca
      area: Computer Science
      degree: Bachelor of Science
      start_date: 2020-09
      end_date: 2023-07
      location: Milan, Italy
      summary: 110/110 cum laude
      highlights:
        - >
          Thesis: [Wavefront Algorithm for Recombination Detection](https://github.com/iFoxz17/WF_Recgraph).
          Implemented a Rust prototype for graph-based sequence alignment.
          
    experience:

      - company: Quantyca | Data at Core
        position: Data Engineer
        start_date: 2025-10
        end_date: present
        location: Monza, Italy
        summary: >
          Data Engineer working on scalable data-intensive systems and enterprise
          data platforms for clients including [Prelios](https://prelios.com/it) and
          [TeamSystem](https://www.teamsystem.com/), with a focus on distributed
          processing, software development and maintainable data solutions.
        
        highlights:
          - >
            For Prelios, developed a configuration-driven alerting system on Databricks,
            supporting 32 configurable alert logics and 54 deployed alerts. Developed
            reusable Python libraries for Jinja-based templating and Azure Service Bus
            integration, and a distributed PySpark pipeline to render, execute and persist
            alert results, with typical execution times of 10–20s per alert and publishing 1K-10K messages
            through Azure Service Bus.
          - >
            For TeamSystem, developed and maintained 9 enterprise data products within a Data Mesh,
            processing gigabytes-to-terabytes of data from sources including Jira, GitHub and security platforms. 
            Used Databricks, PySpark, SQL and Terraform to build and improve data pipelines, datasets, metrics and dashboards, 
            with a focus on performance and resilience.

      - company: Cefriel
        position: Software Engineer Intern
        start_date: 2025-02
        end_date: 2025-09
        location: Milan, Italy
        summary: >
          Software engineering internship within M4ESTRO, a Horizon Europe research
          project focused on resilient manufacturing ecosystems and intelligent
          supply chains.
        highlights:
          - >
            Designed and evaluated a graph-based model for shipment delivery-time prediction
            in a single-manufacturer supply chain network, combining graph theory, Markov chains
            and machine learning.
          - >
            Implemented and deployed the model as an working prototype within the M4ESTRO
            platform using Python, AWS Lambda and AWS CDK, contributing across the software lifecycle from requirements
            analysis through deployment, using real industrial data.
                
      - company: Andreoli Nastri S.n.c.
        position: Freelance Software Engineer Consultant
        start_date: 2024-07
        end_date: 2026-06
        location: Cologno Monzese, Italy
        summary: >
          Developed a complete desktop business application for a small manufacturing SME,
          working directly with the customer from requirements analysis through architecture,
          implementation and deployment. Designed the solution around the expected usage,
          avoiding unnecessary architectural complexity and costs.
        highlights:
          - >
            Designed and developed the application using Java, Spring Boot and Swing,
            integrating the user interface, business logic and persistence layers, with
            CI/CD workflows for automated testing and deployment.
          - >
            Designed and implemented the relational data layer using Spring Data JPA,
            Hibernate and PostgreSQL, with Neon Serverless PostgreSQL and Flyway for
            database deployment and migrations.

