    certifications:
    
      - name: '[Databricks Certified Data Engineer Associate](https://credentials.databricks.com/3901345e-eeb0-43ab-8587-ce946010a4e3#acc.cKrhBwLi)'
        date: 2025-12
      
    projects:
    - name: "[AeroFlux](https://github.com/alegil0206/AeroFlux)"
      start_date: 2024-11
      end_date: 2025-05

      summary: >
        Cloud-native distributed platform for the safe integration of drones
        into European airspace, developed as a Master's software engineering
        project with a focus on distributed systems and safety-critical software.

      highlights:
        - >
          Designed and implemented the flight-plan computation module using graph traversal
          algorithms for real-time, safety-critical route planning.
        - >
          Contributed to microservices for flight authorization, geo-awareness
          and UAV simulation, applying hexagonal architecture to decouple
          business logic from external integrations.
        - >
          Set up CI/CD pipelines to automatically build and deploy services to
          a Kubernetes cluster, later consolidating to Docker-only
          when the underlying VM infrastructure was decommissioned.

    - name: "[Delay Prediction in Supply Chains — A Hybrid Graph-Based and Machine Learning Approach](https://github.com/iFoxz17/sc-delay-prediction)"
      start_date: 2025-02
      end_date: 2025-09

      summary: >
        Master's thesis developed at Cefriel within the Horizon Europe M4ESTRO
        project, combining graph-based modelling and machine learning for
        shipment delay prediction using industrial supply chain data.

      highlights:
        - >
          Modelled supply chain networks as graphs and developed a hybrid
          prediction approach combining graph-based methods, Markov chains
          and machine learning.
        - >
          Evaluated the approach against statistical and graph-based methods
          using industrial data from a manufacturing supply chain.

    - name: "[Wavefront Algorithm for Sequence Alignment](https://github.com/iFoxz17/WF_Recgraph)"
      start_date: 2023-02
      end_date: 2023-07

      summary: >
        Bachelor's thesis implementing a Rust prototype of the Wavefront
        algorithm for sequence alignment over graph-based genome representations.

      highlights:
        - >
          Implemented the Wavefront sequence alignment algorithm in Rust
          for graph-based genome representations.
        - >
          Explored algorithmic optimizations with a focus on computational
          efficiency and memory usage.
          
