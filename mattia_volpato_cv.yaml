design:
  theme: engineeringresumes

  page:
    size: a4
    top_margin: 0.55in
    bottom_margin: 0.55in
    left_margin: 0.65in
    right_margin: 0.65in
    show_footer: true
    show_top_note: false

  colors:
    body: rgb(30,30,30)
    name: rgb(0,72,128)
    headline: rgb(0,72,128)
    connections: rgb(0,72,128)
    section_titles: rgb(0,72,128)
    links: rgb(0,72,128)
    footer: rgb(120,120,120)

  typography:
    line_spacing: 0.58em
    alignment: justified
    date_and_location_column_alignment: right

    font_family:
      body: Source Sans 3
      name: Source Sans 3
      headline: Source Sans 3
      connections: Source Sans 3
      section_titles: Source Sans 3

    font_size:
      body: 10pt
      name: 30pt
      headline: 11pt
      connections: 10pt
      section_titles: 1.3em

    bold:
      name: true
      headline: false
      connections: false
      section_titles: true

    small_caps:
      name: false
      headline: false
      connections: false
      section_titles: false

  links:
    underline: false
    show_external_link_icon: false

  header:
    alignment: left
    space_below_name: 0.25cm
    space_below_headline: 0.15cm
    space_below_connections: 0.25cm

    connections:
      phone_number_format: international
      hyperlink: true
      show_icons: true
      display_urls_instead_of_usernames: false
      separator: " | "
      space_between_connections: 0.2cm

  section_titles:
    type: with_partial_line
    line_thickness: 0.6pt
    space_above: 0.35cm
    space_below: 0.18cm

  sections:
    allow_page_break: true
    space_between_regular_entries: 0.8em
    space_between_text_based_entries: 0.2em

    show_time_spans_in:
      - experience
      - projects

  entries:
    date_and_location_width: 3.6cm
    side_space: 0.15cm
    space_between_columns: 0.12cm

    allow_page_break: false
    short_second_row: true

    summary:
      space_above: 0cm
      space_left: 0cm

    highlights:
      bullet: •
      nested_bullet: "-"
      space_left: 0.15cm
      space_above: 0cm
      space_between_items: 0cm
      space_between_bullet_and_text: 0.45em

  templates:
    footer: "*Mattia Volpato — PAGE_NUMBER/TOTAL_PAGES*"

    single_date: MONTH_ABBREVIATION YEAR
    date_range: START_DATE – END_DATE
    time_span: HOW_MANY_YEARS YEARS HOW_MANY_MONTHS MONTHS


locale:
  language: english


settings:
  current_date: today

  render_command:
    output_folder: rendercv_output

    design:
    locale:

    typst_path: OUTPUT_FOLDER/mattia_volpato_cv.typ
    pdf_path: OUTPUT_FOLDER/mattia_volpato_cv.pdf
    markdown_path: OUTPUT_FOLDER/mattia_volpato_cv.md
    html_path: OUTPUT_FOLDER/mattia_volpato_cv.html
    png_path: OUTPUT_FOLDER/mattia_volpato_cv.png

    dont_generate_markdown: false
    dont_generate_html: false
    dont_generate_typst: false
    dont_generate_pdf: false
    dont_generate_png: false

  bold_keywords:
    - Python
    - Java
    - Spring Boot
    - SQL
    - PySpark
    - Databricks

  pdf_title: Mattia Volpato - Curriculum Vitae