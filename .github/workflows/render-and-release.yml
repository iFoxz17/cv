name: Render CV and Create Release

on:
  push:
    branches:
      - main
      - dev
    paths:
      - 'mattia_volpato_CV.yaml'
      - '.github/workflows/render-and-release.yml'
      - 'requirements.txt'

permissions:
  contents: write

jobs:
  render-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'   # rendercv requires >=3.12; on 3.11 pip silently falls back to the last-compatible 2.3, which is broken

      - name: Install RenderCV and dependencies
        run: |
          pip install --upgrade pip setuptools wheel
          pip install --no-cache-dir -r requirements.txt
          rendercv --version

      - name: Render CV
        run: |
          rendercv render mattia_volpato_CV.yaml --output-folder rendercv_output

      - name: Get version from timestamp
        id: version
        run: |
          echo "version=$(date +'%Y.%m.%d')" >> "$GITHUB_OUTPUT"

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: CV Release - ${{ steps.version.outputs.version }}
          draft: false
          prerelease: false
          body: |
            Automatically rendered CV for Mattia Volpato

            **Files included:**
            - PDF version
            - Markdown version
            - HTML version
          files: |
            ./rendercv_output/mattia_volpato_CV.pdf
            ./rendercv_output/mattia_volpato_CV.md
            ./rendercv_output/mattia_volpato_CV.html
            
      - name: Commit rendered files to repo
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add rendercv_output/
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update rendered CV files" && git push)