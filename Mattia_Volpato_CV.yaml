      - name: "[Supply Chain Delay Prediction](https://github.com/iFoxz17/sc-delay-prediction)"
        start_date: 2025-02
        end_date: 2025-09

        summary: >
          Master's thesis developed at Cefriel within the Horizon Europe
          M4ESTRO project. Research combining graph theory and machine learning
          for predictive analysis of complex supply chain networks. Results are
