        start_date: 2023-02
        end_date: 2023-07

        summary: >
          Bachelor's thesis implementing a Rust prototype of the Wavefront
          algorithm for sequence alignment over graph-based genome
          representations.

        highlights:
          - >
            Implemented the Wavefront sequence alignment algorithm in Rust
            for graph-based genome representations.

          - >
            Studied optimization strategies for graph algorithms and memory usage.

          - >
            Technologies: Rust, Algorithms, Graph Algorithms.

