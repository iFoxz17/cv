        highlights:
          - >
            Modelled supply chain networks as graphs and developed machine
            learning models for delay prediction.

          - >
            Evaluated graph-based and statistical approaches using industrial data
            collected within the M4ESTRO Horizon Europe project.

          - >
            Technologies: Python, Scikit-Learn, SQL, Graph Theory.

