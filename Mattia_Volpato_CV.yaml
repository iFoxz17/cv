        location: Monza, Italy
        summary: >
          Data Engineer designing scalable software and data-intensive
          platforms for enterprise customers, combining backend engineering,
          distributed computing and modern data engineering practices.

        highlights:
          - >
            Developed a scalable alerting platform for Prelios on Databricks,
            designing a YAML-to-Jinja framework with schema validation and
            type checking to generate maintainable alert definitions.

          - >
            Implemented the distributed execution engine, executing parameterized
            PySpark/SQL workloads safely and publishing alerts through Azure
            Service Bus while optimizing distributed query performance.

          - >
            Designed and maintained enterprise data products for TeamSystem,
            covering the complete lifecycle from ingestion and transformation
            to analytics within a Data Mesh architecture.

          - >
            Built scalable ETL pipelines and analytical workloads using
            Databricks, Apache Spark, PySpark and SQL, improving data quality,
            governance and self-service analytics.

          - >
            Technologies: Python, PySpark, SQL, Databricks, Apache Spark,
            Azure Service Bus, Jinja, Fivetran, Witboost, Terraform,
            Data Mesh, Git.

      - company: Cefriel
        position: Junior Software Developer
        start_date: 2025-02
        end_date: 2025-09
        location: Milan, Italy
        summary: >
          Backend software engineering for M4ESTRO, a Horizon Europe research
          project focused on resilient manufacturing ecosystems and intelligent
          supply chains.

        highlights:
          - >
            Designed graph-based models and machine learning pipelines for delay
            prediction and resilience analysis in industrial supply chains.

          - >
            Developed cloud-native microservices using Python, AWS Lambda and AWS CDK.

          - >
            Contributed throughout the software lifecycle from requirements analysis
            to deployment within a Horizon Europe research project.

          - >
            Technologies: Python, Scikit-Learn, AWS Lambda, AWS CDK,
            SQL, Graph Theory, Machine Learning.

      - company: Andreoli Nastri S.n.c.
        position: IT Consultant | Software Engineer
        start_date: 2024-07
        end_date: 2026-06
        location: Cologno Monzese, Italy

        summary: >
          Designed and developed a complete desktop business application for an
          Italian manufacturing SME, managing the project from requirements
          analysis through architecture, implementation and deployment.

        highlights:
          - >
            Developed a complete desktop application using Java, Spring Boot and
            Java Swing, integrating UI, business logic and persistence.

          - >
            Designed the relational database model using Spring Data JPA,
            Hibernate and PostgreSQL.

          - >
            Adopted Neon Serverless PostgreSQL and Flyway migrations to provide
            scalable, low-cost cloud deployment for a small business.

          - >
            Technologies: Java, Spring Boot, Java Swing, Hibernate,
            PostgreSQL, Neon, Flyway.

